name: Nightly Govt Jobs Dashboard Update

on:
  push:
    branches: [main]
    paths:
      - "scripts/govt_job_finder.py"
      - "scripts/update_jobs_dashboard_data.py"
      - "sources_gov_jobs.csv"
      - "jobs/manual-jobs.json"
      - "requirements-govt-jobs.txt"
  schedule:
    # Runs around midnight IST every night. GitHub cron uses UTC.
    # 18:35 UTC = 12:05 AM IST.
    - cron: "35 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-govt-jobs-dashboard-update
  cancel-in-progress: true

jobs:
  update-govt-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-govt-jobs.txt

      - name: Run nightly govt job scanner
        run: |
          python scripts/update_jobs_dashboard_data.py --sources sources_gov_jobs.csv --out-json jobs/jobs-data.json --excel-out jobs/government_jobs_tracker.xlsx --max-pdfs 10 --max-detail-pages 8 --limit 120

      - name: Commit and push updated job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/ sitemap.xml sitemap-govt-jobs.xml robots.txt scripts/generate_govt_job_pages.py scripts/update_jobs_dashboard_data.py profile.json sources_gov_jobs.csv || true
          if git diff --staged --quiet; then
            echo "No job data changes to commit."
            exit 0
          fi
          git commit -m "Auto update govt jobs dashboard data"
          git pull --rebase origin main
          git push origin HEAD:main
