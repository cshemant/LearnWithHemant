name: Twice Daily Faculty Jobs Update

on:
  schedule:
    # GitHub cron uses UTC.
    # 02:30 UTC = 08:00 AM IST, 14:30 UTC = 08:00 PM IST.
    - cron: "30 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-data-writes-main
  cancel-in-progress: false

jobs:
  update-faculty-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-govt-jobs.txt

      - name: Recover permanent faculty URL history
        run: |
          python scripts/preserve_job_history.py --kind faculty

      - name: Generate faculty jobs pages
        run: |
          python scripts/update_faculty_jobs_data.py --sources sources_faculty_jobs.csv --manual-json jobs/faculty-jobs/manual-faculty-jobs.json --out-json jobs/faculty-jobs/faculty-jobs-data.json --limit 180 --max-sources 30 --max-links-per-source 100

      - name: Sync confirmed invalid job URL registry
        run: |
          python scripts/sync_invalid_job_urls.py

      - name: Commit and push updated faculty job pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/ sitemap*.xml robots.txt scripts/ functions/ style.css sources_gov_jobs.csv sources_faculty_jobs.csv profile.json || true
          if git diff --staged --quiet; then
            echo "No faculty job changes to commit."
            exit 0
          fi
          git commit -m "Auto update faculty jobs pages"
          git pull --rebase origin main
          git push origin HEAD:main
