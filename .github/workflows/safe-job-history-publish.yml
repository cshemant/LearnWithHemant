name: Preserve Job URLs and Publish Safely

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-data-writes-main
  cancel-in-progress: false

jobs:
  preserve-and-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[archive-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch --all --tags --prune
          git checkout main
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install page-generation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-govt-jobs.txt

      - name: Recover all historical job URLs
        run: |
          python scripts/preserve_job_history.py --kind all

      - name: Regenerate government and faculty pages
        run: |
          python scripts/generate_govt_job_pages.py
          python scripts/update_faculty_jobs_data.py --mode repair-buttons
          python scripts/sync_invalid_job_urls.py

      - name: Commit repaired history to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/ sitemap*.xml robots.txt scripts/ functions/ style.css .github/workflows/ || true
          if git diff --staged --quiet; then
            echo "No archive repair was needed."
          else
            git commit -m "Preserve job URL history [archive-repair]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish protected snapshot branch
        run: |
          # Point Cloudflare Pages to the 'production' branch. This branch is
          # updated only after URL history has been recovered and pages rebuilt,
          # so a smaller local main-branch push never reaches visitors first.
          git fetch origin production:refs/remotes/origin/production || true
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            OLD_PRODUCTION="$(git rev-parse refs/remotes/origin/production)"
            git push origin HEAD:production --force-with-lease=refs/heads/production:${OLD_PRODUCTION}
          else
            git push origin HEAD:production
          fi
